- defaults:
    link:
      relink: true

- clean: ['~']

- link:
    ~/.config/nvim: nvim
    ~/.config/lazygit: lazygit
    ~/.zshrc: .zshrc
    ~/.tmux.conf: tmux.conf
    ~/.local/bin/claude-inspect: bin/claude-inspect

- shell:
  - [touch ~/.zshrc.local, Creating zsh local file]
  - [git submodule update --init --recursive, Installing submodules]

