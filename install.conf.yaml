- defaults:
    link:
      relink: true

- clean: ['~']

- link:
    ~/.config/nvim: nvim
    ~/.config/lazygit: lazygit
    ~/.zshrc: .zshrc
    ~/.tmux.conf: tmux.conf

- shell:
  - [touch ~/.zshrc.local, Creating zsh local file]
  - [git submodule update --init --recursive, Installing submodules]

