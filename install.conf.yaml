- defaults:
    link:
      relink: true

- clean: ['~']

- link:
    ~/.config/nvim: nvim
    ~/.config/lazygit: lazygit
    ~/.zshrc: .zshrc
    ~/.zshrc.d: zshrc.d
    ~/.tmux.conf: tmux.conf
    ~/.config/mise/config.toml:
      path: mise/global.toml
      create: true

- shell:
  - [touch ~/.zshrc.local, Creating zsh local file]
  - [git submodule update --init --recursive, Installing submodules]

