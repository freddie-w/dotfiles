# Set prefix to Option-Space (iTerm2 maps Option-Space to Esc+Space).
# Not Ctrl-Space, which is autocomplete in nvim.
unbind C-b
unbind C-Space
set-option -g prefix M-Space
bind M-Space send-prefix

# Ctrl+h/j/k/l moves between panes, passing through to nvim when it has the pane
# so it can move between its own windows first (vim-tmux-navigator).
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?|fzf)(diff)?$'"
bind -n C-h if-shell "$is_vim" "send-keys C-h" "select-pane -L"
bind -n C-j if-shell "$is_vim" "send-keys C-j" "select-pane -D"
bind -n C-k if-shell "$is_vim" "send-keys C-k" "select-pane -U"
bind -n C-l if-shell "$is_vim" "send-keys C-l" "select-pane -R"
bind -T copy-mode-vi C-h select-pane -L
bind -T copy-mode-vi C-j select-pane -D
bind -T copy-mode-vi C-k select-pane -U
bind -T copy-mode-vi C-l select-pane -R

# Ctrl+l is taken by pane navigation, so clear the screen with prefix + Ctrl+l
bind C-l send-keys C-l

# Pane navigation (prefix + vim keys)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R


# Resize panes with prefix + Vim-style directional keys
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Enter copy mode with Vim keys
setw -g mode-keys vi

# Copy mode
bind [ copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"

# Allow repeatable commands after prefix
set-option -g repeat-time 500

# Vim-style intuitive splits with cwd inheritance
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Create new window in current pane's directory
bind c new-window -c "#{pane_current_path}"

# Keep more scrollback than the 2000 line default
set -g history-limit 50000

# Start window and pane numbering at 1
set -g base-index 1
setw -g pane-base-index 1

# Renumber windows when one is closed
set -g renumber-windows on

# Auto-rename windows to current program
setw -g automatic-rename on

# Disable default activity monitoring
set -g monitor-activity off
set -g visual-activity off
set -g bell-action none



# Status bar
set -g status-style "bg=colour236,fg=white"
set -g window-status-format " #I:#W "
set -g window-status-style "bg=colour236,fg=white"
set -g window-status-activity-style "bg=colour236,fg=white"
set -g window-status-current-format " #I:#W "
set -g window-status-current-style "bg=white,fg=black,bold"
set -g status-left-length 0
set -g status-left "#{?client_prefix,#[bg=white#,fg=black#,bold] #S #[default],#[default][#S]} "
set -g status-right ""

# Pane borders (midpoint between active and dim backgrounds)
set -g pane-border-style "fg=#181922,bg=#181922"
set -g pane-active-border-style "fg=#181922,bg=#181922"

# Send focus events to programs (needed for nvim FocusLost/FocusGained)
set -g focus-events on

# Dim inactive panes
set -g window-style "bg=#16161e"
set -g window-active-style "bg=terminal"

# Enable Shift + Enter in Claude Code
bind-key -n S-Enter send-keys Escape "[13;2u"
set -s extended-keys on
set -as terminal-features 'tmux-256color:extkeys'

# Tell tmux iTerm2 supports true colour, so nvim colours aren't reduced to 256
set -as terminal-features ',xterm-256color:RGB'

