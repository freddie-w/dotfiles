# Set prefix to Ctrl-q
unbind C-b
set-option -g prefix C-q
bind C-q send-prefix

# Pane navigation (prefix + vim keys)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R


# Resize panes with prefix + Vim-style directional keys
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Enter copy mode with Vim keys
setw -g mode-keys vi

# Use prefix + [ to enter copy mode
bind [ copy-mode

# Allow repeatable commands after prefix
set-option -g repeat-time 500

# Vim-style intuitive splits with cwd inheritance
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Create new window in current pane's directory
bind c new-window -c "#{pane_current_path}"

# Start window and pane numbering at 1
set -g base-index 1
setw -g pane-base-index 1

# Renumber windows when one is closed
set -g renumber-windows on

# Auto-rename windows to current program
setw -g automatic-rename on

# Disable default activity monitoring
set -g monitor-activity off
set -g visual-activity off
set -g bell-action none



# Status bar
set -g status-style "bg=colour236,fg=white"
set -g window-status-format " #I:#W "
set -g window-status-style "bg=colour236,fg=white"
set -g window-status-activity-style "bg=colour236,fg=white"
set -g window-status-current-format " #I:#W "
set -g window-status-current-style "bg=white,fg=black,bold"
set -g status-left "#{?client_prefix,^Q ,}[#S] "
set -g status-right ""

# Pane borders
set -g pane-border-style "fg=colour236"
set -g pane-active-border-style "fg=white"



